clarity_review_task:
  description: >
    Review the readability of the text below.
    Point out long or complex sentences, repetition and vague expressions.
    Use the count_words and count_long_sentences tools to measure the text
    before writing the review.

    Text:
    {text}
  expected_output: >
    A short readability review in Turkish with bullet points.

claim_review_task:
  description: >
    Find the important claims in the text below.
    For each claim decide whether it is an opinion, a prediction or a
    verifiable statement, and whether it needs evidence or a source.
    Use the find_absolute_phrases tool to detect absolute wording.

    Text:
    {text}
  expected_output: >
    The claims written as quoted sentences from the text, the claims that
    need evidence or a source, and the absolute phrases found in the text.

improvement_task:
  description: >
    Edit the text below. Using the earlier review results, summarize the
    most important problems, give practical suggestions and write a short
    revised version of the text. This is editing work, not a new review.

    Text:
    {text}
  expected_output: >
    A plain text review in Turkish with exactly these sections:

    İnceleme Özeti

    Anlatım
    (one or two sentences about readability)

    Destek Gerektiren İddialar
    - (quoted claims)

    Riskli İfadeler
    - (quoted absolute or vague phrases)

    Öneriler
    - (practical suggestions)

    Revize Metin
    (the improved text)

    Start every list item with '-'. Do not use numbered lists, markdown
    headings, bold text or tables.
  # In hierarchical mode this limits the manager's delegation to this agent.
  agent: improvement_editor
  context:
    - clarity_review_task
    - claim_review_task
