[project]
name = "content_review_crew"
version = "0.1.0"
description = "content-review-crew using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai>=1.15.23,<2.0.0"
]

[project.scripts]
content_review_crew = "content_review_crew.main:run"
run_crew = "content_review_crew.main:run"
train = "content_review_crew.main:train"
replay = "content_review_crew.main:replay"
test = "content_review_crew.main:test"
run_with_trigger = "content_review_crew.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
project_id = "04b60b65-485e-4058-b814-e3d0553aad9b"
