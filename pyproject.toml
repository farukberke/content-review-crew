[project]
name = "content_review_crew"
version = "0.1.0"
description = "Reviews a text from different angles with a hierarchical CrewAI crew"
authors = [{ name = "Faruk Berke Çevik", email = "krfablao@hotmail.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai>=1.15.23,<2.0.0",
    "gradio>=6.29.0",
]

[project.scripts]
content_review_crew = "content_review_crew.main:run"
run_crew = "content_review_crew.main:run"
check_llm = "content_review_crew.check_llm:run"
review_ui = "content_review_crew.app:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
project_id = "04b60b65-485e-4058-b814-e3d0553aad9b"
